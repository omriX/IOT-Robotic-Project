<text x="55" y="998" class="note">Header groups are schematic, not physical header positions. G/V contact use and hidden board traces are not verified by this photo.</text>
<text x="55" y="1029" class="note">Motor signals go through the driver. Battery feed, encoder power wiring, and exact driver terminals require hardware verification.</text>
