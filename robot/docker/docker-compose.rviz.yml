# Add after docker-compose.yml and docker-compose.linux.yml on Ubuntu.
# Pass DISPLAY and XAUTHORITY from the logged-in graphical session.
services:
  ros_tools:
    environment:
      DISPLAY: ${DISPLAY:?Set DISPLAY from your Ubuntu desktop session}
      XAUTHORITY: /tmp/robot-rviz.xauth
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:?Set XAUTHORITY to your Ubuntu X11 authority file}:/tmp/robot-rviz.xauth:ro
