[platformio]
src_dir = robot/robot_base

[env:robot_base]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<platformio_main.cpp>
lib_extra_dirs = robot/libraries
lib_deps =
    madhephaestus/ESP32Encoder@0.11.8
    powerbroker2/ArduPID@0.2.1
    ayushsharma82/WebSerial@2.1.2
    ESP32Async/AsyncTCP@3.3.2
    ESP32Async/ESPAsyncWebServer@3.6.0
extra_scripts = pre:robot/platformio_link.py

; Same firmware, micro-ROS over the USB cable (docker compose up agent-serial, Linux only).
[env:robot_base_serial]
extends = env:robot_base
build_flags = -DMICROROS_TRANSPORT_SERIAL=1
