; Standalone hardware tests, one env per component. USB Serial only, no Wi-Fi.
; From the repository root:
;   pio run -d unit_tests/hardware -e motors -t upload
;   pio device monitor -b 115200
; Flash the real firmware again afterwards: pio run -e robot_base -t upload

[platformio]
src_dir = .

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = -I ../../robot/robot_base

[env:motors]
build_src_filter = +<motors/>
lib_deps = madhephaestus/ESP32Encoder@0.11.8

[env:encoders]
build_src_filter = +<encoders/>
lib_deps = madhephaestus/ESP32Encoder@0.11.8

[env:battery]
build_src_filter = +<battery/>

[env:status_led]
build_src_filter = +<status_led/>
